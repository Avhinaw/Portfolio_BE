# coturn configuration (see README "TURN server").
listening-port=3478
tls-listening-port=5349
# Relay port range: open it in the firewall (UDP; TCP if you use TCP allocations).
min-port=49160
max-port=49200

fingerprint
use-auth-secret        # secret is passed with --static-auth-secret (matches TURN_SHARED_SECRET)
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Block relaying to private networks so TURN cannot be abused to reach your internal services.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

total-quota=20
user-quota=6

# For TURNS (TLS on 5349), mount your certificate and uncomment:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
